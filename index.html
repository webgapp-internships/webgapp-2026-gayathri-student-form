<!DOCTYPE html>
<html>
<head>
    <title>Student</title>

    <style>

        body{
            margin:0;
            padding:0;
            background-color:rgb(7, 40, 68);
            display:flex;
            justify-content:center;
            align-items:center;
            height:700px;
        }

        .login-box{
            width:350px;
            background:rgb(8, 40, 109);
            padding:40px;
            text-align:center;
            box-shadow:0px 0px 10px rgba(63, 190, 207, 0.2);
        }

        .logo{
            width:222px;
            margin-bottom:1px;
        }

        h2{
            margin-top:0;
            color:rgb(228, 228, 236);
        }

        .text{
            color:gray;
        
        }

        input{
            width:100%;
            padding:15px;
            margin-bottom:20px;
            border:1px solid #555;
            font-size:18px;
            box-sizing:border-box;
        }

        .btn{
            width:100%;
            padding:14px;
            background:rgb(33, 130, 221);
            color:white;
            border:none;
            font-size:20px;
            cursor:pointer;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img src="DIV.png" class="logo">

        <h2>DIVDHAR ARTS AND SCIENCE COLLEGE</h2>
         
        <form action="open.html">

        <input type="text" placeholder="Enter Your Name" required/>

        <input type="tel" placeholder="Enter Your Phone Number" maxlength="10"oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" required>

        <button class="btn">Login</button>
        </form>
</body>
</html>
