<!DOCTYPE html>
<html>
<head>
    <title>Student</title>

    <style>

        body{
            margin:0;
            padding:0;
            background-color:aliceblue;
            display:flex;
            justify-content:center;
            align-items:center;
            height:700px;
        }

        .login-box{
            width:350px;
            background:white;
            padding:40px;
            text-align:center;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        .logo{
            width:222px;
            margin-bottom:1px;
        }

        h2{
            margin-top:0;
            color:darkblue;
        }

        .text{
            color:gray;
        
        }

        input{
            width:100%;
            padding:15px;
            margin-bottom:20px;
            border:1px solid #555;
            font-size:18px;
            box-sizing:border-box;
        }

        .btn{
            width:100%;
            padding:14px;
            background:green;
            color:white;
            border:none;
            font-size:20px;
            cursor:pointer;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img src="clg.jpg" class="logo">

        <h2>SRI KALISWARI COLLEGE</h2>
         
        <form action="open.html">

        <input type="tel" placeholder="Enter Your Mobile no" required/>

        <input type="password" placeholder="Date of Birth" required/>

        <button class="btn">Login</button>
        </form>
</body>
</html>
