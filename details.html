<!DOCTYPE html>
<html>
<head>
<title>Price Details</title>

<style>

.container{
    display:flex;
    gap:30px;
    justify-content:center;
    flex-wrap:wrap;
}

.card{
    border:2px solid green;
    width:400px;
    text-align:center;
    padding:10px;
    border-radius:10px;
}

.card img{
    width:300px;
    height:200px;
}

h1{
    text-align:center;
    color:green;
}

.price{
    color:red;
    font-weight:bold;
    font-size:20px;
}


</style>

</head>
<body>

<h1>🥕 Vegetable Price Details 🥕</h1>

<div class="container">

    <div class="card">
        <img src="p2.avif" alt="Tomato">
        <h3>🍅 Tomato</h3>
        <p class="price">₹40 / kg</p>
    </div>

    <div class="card">
        <img src="p3.avif" alt="Carrot">
        <h3>🥕 Carrot</h3>
        <p class="price">₹60 / kg</p>
    </div>

    <div class="card">
        <img src="pot.jpg" alt="Potato">
        <h3>🥔 Potato</h3>
        <p class="price">₹35 / kg</p>
    </div>

    <div class="card">
        <img src="cab.jpg" alt="Onion">
        <h3>🥬cabage</h3>
        <p class="price">₹45 / kg</p>
    </div>

    <div class="card">
        <img src="cali.jpg" alt="Onion">
        <h3>🥦Cauliflower</h3>
        <p class="price">₹60 / kg</p>
    </div>

     <div class="card">
        <img src="cc.jpg" alt="Onion">
        <h3> 🫑Capsicum</h3>
        <p class="price">₹85 / kg</p>
    </div>
</div>

</body>
</html>
